<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant · Man Friday</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2324584a'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EMF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"></header>
<main class="container">
  <div class="page-head">
    <div>
      <h1 id="greeting">Assistant</h1>
      <p id="skills-line">Pick up open errands and keep clients posted as you go.</p>
    </div>
    <span class="updated" data-updated></span>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-value" data-stat="available">–</div><div class="stat-label tone-info"><span class="dot"></span>Open errands</div></div>
    <div class="stat"><div class="stat-value" data-stat="active">–</div><div class="stat-label tone-warn"><span class="dot"></span>On my plate</div></div>
    <div class="stat"><div class="stat-value" data-stat="done">–</div><div class="stat-label tone-ok"><span class="dot"></span>Completed by me</div></div>
  </div>

  <section class="section">
    <div class="section-head">
      <div class="tabs" role="tablist" aria-label="Errand lists" id="views">
        <button class="tab" role="tab" type="button" aria-selected="true" data-tab="available">Available <span class="count" data-count="available">0</span></button>
        <button class="tab" role="tab" type="button" aria-selected="false" data-tab="active">My active <span class="count" data-count="active">0</span></button>
        <button class="tab" role="tab" type="button" aria-selected="false" data-tab="history">History <span class="count" data-count="history">0</span></button>
      </div>
    </div>
    <div class="chips" id="cat-filter" aria-label="Filter by category"></div>
    <div id="jobs" class="list" aria-live="polite"></div>
  </section>
</main>
<script src="js/app.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
