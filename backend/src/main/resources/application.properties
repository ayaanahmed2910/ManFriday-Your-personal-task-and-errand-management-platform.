server.port=8082

# Database (override with env vars DB_URL / DB_USERNAME / DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/manfriday?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

# Schema is managed by src/main/resources/schema.sql, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Initial admin account, created on first start (change the password for any shared deployment)
manfriday.admin.username=${ADMIN_USERNAME:admin}
manfriday.admin.password=${ADMIN_PASSWORD:admin123}
